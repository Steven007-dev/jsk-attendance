name: jsk_attendance
description: "JSK Institute attendance register - Flutter port of the JSK attendance web app."
publish_to: 'none'
version: 1.5.19+19

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.15.2
  firebase_messaging: 16.7.1
  flutter_local_notifications: 19.5.0
  cupertino_icons: ^1.0.8
  file_selector: ^1.0.4
  geolocator: ^14.0.2
  image: ^4.12.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  supabase_flutter: ^2.9.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
